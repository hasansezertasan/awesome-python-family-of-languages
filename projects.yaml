configuration:
  markdown_header_file: "config/header.md"
  markdown_footer_file: "config/footer.md"

categories:
  - category: "miscellaneous"
    title: "Miscellaneous"
    subtitle: "If you can think of a more appropriate category for the items below, PRs welcome!"
  - category: "supersets"
    title: "Supersets of Python"
    subtitle: "Languages that extend Python with additional syntax or features."
  - category: "subsets"
    title: "Subsets of Python"
    subtitle: "Restricted subsets of Python targeting specific domains or platforms."
  - category: "implemented-in-other-languages"
    title: "Python Implemented in Other Languages"
    subtitle: "Alternative Python interpreters and runtimes written in languages other than C."
  - category: "compilers"
    title: "Python Compilers"
    subtitle: "Tools that compile Python to other targets like C, C++, or machine code."
  - category: "cpython-forks"
    title: "CPython Forks & JITs"
    subtitle: "Forks and extensions of the CPython interpreter focused on performance."

labels:
